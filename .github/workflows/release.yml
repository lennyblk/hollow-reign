name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: Zip binary
        run: Compress-Archive -Path target/release/hollow-reign.exe -DestinationPath hollow-reign-x86_64-pc-windows-msvc.zip -CompressionLevel NoCompression
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: hollow-reign-x86_64-pc-windows-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
